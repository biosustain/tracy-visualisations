<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
  <title>Tracy — Indigo View</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" crossorigin="anonymous">
  <style>
    body { padding-top: 1.5rem; padding-bottom: 3rem; }
    trace-view, alignment-view, decomposition-view, variants-view { display: block; margin-top: 1rem; }
  </style>
</head>
<body>
<div class="container">
  <h2 class="mb-3">Tracy — Indigo View</h2>
  <p class="text-muted small">Source: <strong>{{filename}}</strong></p>

  <h4>Trace &amp; basecall viewer</h4>
  <trace-view id="trace-chart"></trace-view>

  <h4 class="mt-4">Alt1 Alignment</h4>
  <alignment-view id="alignment-chart-1"></alignment-view>

  <h4 class="mt-4">Alt2 Alignment</h4>
  <alignment-view id="alignment-chart-2"></alignment-view>

  <h4 class="mt-4">Alt1 vs Alt2 Alignment</h4>
  <alignment-view id="alignment-chart-3"></alignment-view>

  <h4 class="mt-4">Variants</h4>
  <variants-view id="variants-table" style="overflow-x: auto;"></variants-view>

  <h4 class="mt-4">Decomposition plot</h4>
  <decomposition-view id="decomposition-chart"></decomposition-view>
</div>

<script src="https://cdn.plot.ly/plotly-1.39.2.min.js"
        crossorigin="anonymous"></script>
<script>
{{indigo_js}}
</script>
<script>
(function () {
  var data = {{data_json}};

  function ungappedLocal(seq) { return seq.replace(/-/g, ''); }

  // The variant to show travels in a query parameter named after the variants
  // table, e.g. `report.html?variants-table=2`. The value is the 0-based row
  // index of the variant in tracy's `variants` table, which is also the order
  // the variants are reported in downstream mutation tables, so such a table
  // can link each of its rows straight to the matching trace position. Absent
  // or out-of-range values are ignored, so a stale link still renders the full
  // viewer.
  function requestedVariantIndex(variantsTable) {
    var requested = new URLSearchParams(window.location.search).get(variantsTable.id);
    if (requested === null || !/^\d+$/.test(requested)) return null;

    var index = Number(requested);
    var rows = (data.variants && data.variants.rows) || [];
    return index < rows.length ? index : null;
  }

  // Write the shown variant back into the URL, so the address bar is always a
  // link to what is on screen, whether the row was reached through such a link
  // or by clicking its icon. Pushes an entry so that back and forward walk
  // through the variants that were looked at, but only when the variant
  // actually changes, to keep repeated clicks on one row out of the history.
  function rememberVariantInUrl(variantsTable, index) {
    var params = new URLSearchParams(window.location.search);
    if (params.get(variantsTable.id) === String(index)) return;

    params.set(variantsTable.id, index);

    try {
      window.history.pushState(
        null, '', window.location.pathname + '?' + params + window.location.hash
      );
    } catch (error) {
      // A browser that refuses to rewrite the URL of a `file://` document only
      // costs a stale address bar; the viewer itself still works.
    }
  }

  // The variants table registers its own "show in trace viewer" action on
  // `window.__variantViewers`, keyed by element id, and its row icons call it
  // from there. Wrapping it there puts a link and a clicked row on the same
  // path, so both end up reflected in the URL.
  function trackVariantSelection(variantsTable) {
    var viewers = window.__variantViewers;
    var showVariant = viewers && viewers[variantsTable.id];
    if (typeof showVariant !== 'function') return;

    viewers[variantsTable.id] = function (index) {
      showVariant(index);
      rememberVariantInUrl(variantsTable, index);
    };

    // Follow whatever the URL currently names, without writing it back: the
    // parameter is already there, and pushing it again would duplicate the
    // entry that was just navigated to.
    function followUrl() {
      var index = requestedVariantIndex(variantsTable);
      if (index !== null) showVariant(index);
    }

    followUrl();
    // Back and forward move between the pushed entries without reloading the
    // page, so the view has to be brought along by hand. Editing the query in
    // the address bar does reload, and arrives through the followUrl() above.
    window.addEventListener('popstate', followUrl);
  }

  document.addEventListener('DOMContentLoaded', function () {
    var traceChart        = document.getElementById('trace-chart');
    var alignmentChart1   = document.getElementById('alignment-chart-1');
    var alignmentChart2   = document.getElementById('alignment-chart-2');
    var alignmentChart3   = document.getElementById('alignment-chart-3');
    var variantsTable     = document.getElementById('variants-table');
    var decompositionChart = document.getElementById('decomposition-chart');

    if (traceChart && typeof traceChart.displayData === 'function') {
      traceChart.displayData(data);
    }
    if (decompositionChart && typeof decompositionChart.displayData === 'function') {
      decompositionChart.displayData(data);
    }

    var alignmentCharactersPerLine = 80;

    var alt1 = {
      sequence: ungappedLocal(data.alt1align || ''),
      alignmentString: data.alt1align || '',
      isReverseComplement: false,
      chromosome: 'Alt1',
      startPosition: 1,
      label: 'Alt1',
      alleleFraction: data.allele1fraction
    };
    var ref1 = {
      sequence: ungappedLocal(data.ref1align || ''),
      alignmentString: data.ref1align || '',
      isReverseComplement: data.ref1forward === 0,
      chromosome: data.ref1chr || '',
      startPosition: data.ref1pos || 1,
      label: 'Ref'
    };
    if (alignmentChart1 && typeof alignmentChart1.displayData === 'function') {
      alignmentChart1.displayData({
        alt: alt1, ref: ref1,
        charactersPerLine: alignmentCharactersPerLine,
        score: data.align1score || undefined
      });
    }

    var alt2 = {
      sequence: ungappedLocal(data.alt2align || ''),
      alignmentString: data.alt2align || '',
      isReverseComplement: false,
      chromosome: 'Alt2',
      startPosition: 1,
      label: 'Alt2',
      alleleFraction: data.allele2fraction
    };
    var ref2 = {
      sequence: ungappedLocal(data.ref2align || ''),
      alignmentString: data.ref2align || '',
      isReverseComplement: data.ref2forward === 0,
      chromosome: data.ref2chr || '',
      startPosition: data.ref2pos || 1,
      label: 'Ref'
    };
    if (alignmentChart2 && typeof alignmentChart2.displayData === 'function') {
      alignmentChart2.displayData({
        alt: alt2, ref: ref2,
        charactersPerLine: alignmentCharactersPerLine,
        score: data.align2score || undefined
      });
    }

    var alt3 = Object.assign({}, alt1, { alignmentString: data.allele1align || '' });
    var ref3 = Object.assign({}, alt2, { alignmentString: data.allele2align || '' });
    if (alignmentChart3 && typeof alignmentChart3.displayData === 'function') {
      alignmentChart3.displayData({
        alt: alt3, ref: ref3,
        charactersPerLine: alignmentCharactersPerLine,
        score: data.align3score || undefined
      });
    }

    if (variantsTable && typeof variantsTable.displayData === 'function') {
      variantsTable.displayData(data, traceChart);
      trackVariantSelection(variantsTable);
    }
  });
})();
</script>
</body>
</html>
