<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
  <title>Tracy — Trace View</title>
  <link rel="stylesheet"
        href="https://www.gear-genomics.com/libs/bootstrap/4.0.0/css/bootstrap.min.css"
        crossorigin="anonymous">
  <style>
    body { padding-top: 1.5rem; padding-bottom: 3rem; }
    trace-view { display: block; margin-top: 1rem; }
  </style>
</head>
<body>
<div class="container">
  <h2 class="mb-3">Tracy — Trace View</h2>
  <p class="text-muted small">Source: <strong>{{filename}}</strong></p>
  <trace-view id="trace-chart"></trace-view>
</div>

<script>
{{traceview_js}}
</script>
<script>
(function () {
  var data = {{data_json}};
  document.addEventListener('DOMContentLoaded', function () {
    var el = document.getElementById('trace-chart');
    if (el && typeof el.displayData === 'function') {
      el.displayData(data);
    }
  });
})();
</script>
</body>
</html>
