<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
  <title>{{filename}} — Assembly Editor</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" crossorigin="anonymous">
  <style>
{{components_css}}
  </style>
  <style>
    body { padding-top: 1.5rem; padding-bottom: 3rem; }
  </style>
</head>
<body>
<div class="container-fluid">
  <h2 class="mb-3">{{filename}} — Assembly Editor</h2>
  <p class="text-muted small">Source: <strong>{{filename}}</strong></p>

  <pearl-assembly-view id="assembly"></pearl-assembly-view>

  <div class="mt-3">
    <button type="button" class="btn btn-outline-primary" id="save-fasta">
      Download edited sequence (FASTA)
    </button>
    <span class="text-muted small ml-2" id="edit-status"></span>
  </div>
</div>

<script>
{{components_js}}
</script>
<script>
(function () {
  var assembly = document.getElementById('assembly');
  var status = document.getElementById('edit-status');

  var data = {{data_json}};

  // A session saved out of pearl already carries the user's edits and the
  // colour coding derived from them; deriving again would discard exactly the
  // work that was saved.
  var alreadyEdited = Object.prototype.hasOwnProperty.call(data, 'controlSequence');
  assembly.displayData(data, { prepared: alreadyEdited });

  assembly.addEventListener('assembly-change', function () {
    status.textContent = 'edited — not yet downloaded';
  });

  // The report is a file:// page with no server to save back to, so the edited
  // sequence leaves the same way pearl's own save button provides it.
  document.getElementById('save-fasta').addEventListener('click', function () {
    var content = '>user sequence\n' + assembly.userEditedSequence.replace(/-/g, '');
    var blob = new Blob([content], { type: 'text/plain' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'user_sequence.fa';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
    status.textContent = 'downloaded';
  });
})();
</script>
</body>
</html>
