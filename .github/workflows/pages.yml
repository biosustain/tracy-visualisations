name: Build and Publish Demo Site

on:
  push: &main_push
    branches: ["main"]
    paths:
      - "demo/**"
      - "scripts/build_demo_site.py"
      - "src/**"
      - "tests/data/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request: *main_push
  workflow_dispatch:

permissions:
  contents: read

# A Pages deployment replaces the live site, so let one finish rather than
# cancelling it half-published.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # The site is built by importing the package, so never publish a page from a
  # package that fails its own test suite - which includes the checks that the
  # demo page and the build agree on every sample file.
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: Build demo site
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # The samples and the components both come out of the submodules, so a
      # missing pin would otherwise publish a page of empty viewers.
      - name: Verify submodule pins
        run: ./scripts/bootstrap-submodules.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Build site
        run: ./scripts/build_demo_site.py --output site

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Pull requests stop at the build above: it is the check that the page still
  # assembles, and a fork cannot be trusted with a deployment.
  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
