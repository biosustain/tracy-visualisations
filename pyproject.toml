[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracy-visualisations"
version = "0.1.0"
description = "Bundle Tracy JSON output with web visualisation components into self-contained HTML files"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["bioinformatics", "sanger", "chromatogram", "visualisation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "responses>=0.23",
]

[project.scripts]
tracy-vis = "tracy_visualisations.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Must stay in step with COMPONENTS in tracy_visualisations/components.py;
# tests/test_vendor.py fails if the registry references a file not listed here.
"tracy_visualisations" = [
    "vendor/teal/client/src/static/js/traceView.js",
    "vendor/sage/client/src/static/js/traceView.js",
    "vendor/indigo/client/src/static/js/elements.js",
    "vendor/pearl/client/src/static/js/pearl.js",
    "vendor/sabre/client/src/static/js/sabre.js",
    "vendor/sabre/client/src/static/css/sabre.css",
    "templates/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
